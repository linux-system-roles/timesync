---
- name: Restart ntpd during the role with timesync_restart_immediate
  hosts: all
  vars:
    timesync_ntp_provider: ntp
    timesync_restart_immediate: true
  tasks:
    - name: Install then remove ntp
      check_mode: false
      tags: tests::setup
      block:
        - name: Install ntp
          package:
            name: ntp
            state: present
          register: package_install
          ignore_errors: true  # noqa ignore-errors

        - name: Skip test if no ntp package
          meta: end_play
          when: package_install.failed

        - name: Remove ntp
          package:
            name: ntp
            state: absent

    - name: Run the test
      when: not __bootc_validation | d(false)
      block:
        - name: Run the role to set up ntp
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            timesync_ntp_servers:
              - hostname: 172.16.123.1

        - name: Check the restart on booted systems
          tags: tests::verify
          when: __timesync_is_booted
          block:
            - name: Get ntpd status before the configuration change
              systemd:
                name: ntpd
              register: __ntpd_before

            - name: Run the role with a different NTP server
              include_tasks: tasks/run_role_with_clear_facts.yml
              vars:
                timesync_ntp_servers:
                  - hostname: 172.16.123.2

            - name: Get ntpd status after the configuration change
              systemd:
                name: ntpd
              register: __ntpd_after

            - name: Check that ntpd was restarted during the role
              assert:
                that:
                  - __ntpd_after.status.ExecMainPID !=
                    __ntpd_before.status.ExecMainPID

      always:
        - name: Cleanup after tests
          include_tasks: tasks/cleanup.yml
          tags: tests::cleanup
