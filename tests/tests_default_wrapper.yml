---
- name: Create static inventory from hostvars
  tags:
    - tests::slow
    - tests::booted
  hosts: all
  tasks:
    - name: Save connection method
      set_fact:
        __ansible_connection: "{{ ansible_connection }}"

    - name: Create temporary file
      tempfile:
        state: file
        suffix: .inventory.yaml
      register: tempinventory
      delegate_to: localhost

    - name: Create static inventory from hostvars
      template:
        src: inventory.yaml.j2
        dest: "{{ tempinventory.path }}"
        mode: '0644'
      delegate_to: localhost

- name: Run tests_default.yml normally
  tags:
    - tests::slow
    - tests::booted
  import_playbook: tests_default.yml

- name: Run tests_default.yml in check_mode
  tags:
    - tests::slow
    - tests::booted
  hosts: all
  tasks:
    - name: Run ansible-playbook with tests_default.yml in check mode
      command: >-
        {{ __ap_cmd | quote }} -vvv -i {{ tempinventory.path }}
        --check tests_default.yml
      changed_when: false
      delegate_to: localhost
      register: __check_mode_result
      failed_when: __check_mode_result is failed
        or __check_mode_result.stdout_lines | select('search', _begin_pattern) | list | length == 0
        or __check_mode_result.stdout_lines | select('search', _success_pattern) | list | length == 0
      vars:
        __ap_cmd: "{{ ansible_playbook_filepath | d('ansible-playbook') }}"
        _begin_pattern: >-
          Check mode: message not logged - .* role_name=timesync .* status=begin .* ansible_check_mode=[Tt]rue
        _success_pattern: >-
          Check mode: message not logged - .* role_name=timesync .* status=success .* ansible_check_mode=[Tt]rue

    - name: Remove the temporary file
      file:
        path: "{{ tempinventory.path }}"
        state: absent
      when: tempinventory.path is defined
      delegate_to: localhost
