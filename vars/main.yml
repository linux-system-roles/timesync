---
__timesync_chrony_version: "{{
  ansible_facts.packages['chrony'][0].version | default('0')
  if 'chrony' in ansible_facts.packages else '0' }}"
__timesync_ntp_version: "{{
  ansible_facts.packages['ntp'][0].version | default('0')
  if 'ntp' in ansible_facts.packages else '0' }}"
__timesync_chrony_keyfile_group: chrony

# ansible_facts required by the role
__timesync_required_facts:
  - distribution
  - distribution_major_version
  - distribution_version
  - os_family

# the subsets of ansible_facts that need to be gathered in case any of the
# facts in required_facts is missing; see the documentation of
# the 'gather_subset' parameter of the 'setup' module
__timesync_required_facts_subsets: "{{ ['!all', '!min'] +
  __timesync_required_facts }}"

__timesync_write_log_file: false

# BEGIN - DO NOT EDIT THIS BLOCK - rh distros variables
# Ansible distribution identifiers that the role treats like RHEL
__timesync_rh_distros:
  - AlmaLinux
  - CentOS
  - RedHat
  - Rocky

# Same as above but includes Fedora
__timesync_rh_distros_fedora: "{{ __timesync_rh_distros + ['Fedora'] }}"

# Use this in conditionals to check if distro is Red Hat or clone
__timesync_is_rh_distro: "{{ ansible_facts['distribution'] in __timesync_rh_distros }}"

# Use this in conditionals to check if distro is Red Hat or clone, or Fedora
__timesync_is_rh_distro_fedora: "{{ ansible_facts['distribution'] in __timesync_rh_distros_fedora }}"

# Use these in conditionals to check if distro is Red Hat or clone of a specific major version
__timesync_is_rh_distro_7: "{{ __timesync_is_rh_distro and ansible_facts['distribution_major_version'] == '7' }}"
__timesync_is_rh_distro_8: "{{ __timesync_is_rh_distro and ansible_facts['distribution_major_version'] == '8' }}"
__timesync_is_rh_distro_9: "{{ __timesync_is_rh_distro and ansible_facts['distribution_major_version'] == '9' }}"
__timesync_is_rh_distro_10: "{{ __timesync_is_rh_distro and ansible_facts['distribution_major_version'] == '10' }}"
# END - DO NOT EDIT THIS BLOCK - rh distros variables
